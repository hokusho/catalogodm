<!DOCTYPE html>
<html lang="pt-BR">

<head>

        <h2 style="text-align: left; margin-bottom: 1.5rem; font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; color: var(--text-color);">NAVEGUE POR CATEGORIAS.</h2>

        <div class="not-found-contact" style="text-align: center; margin: 4rem auto 2rem; max-width: 800px; padding: 2.5rem 1.5rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--card-border);">
