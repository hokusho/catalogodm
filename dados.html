<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Gerenciar Dados | DM-BH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="dados">
    <div id="loginModal" class="modal-overlay active">
        <div class="modal-content" style="max-width: 400px;">
            <h3 style="text-align: center;">&#128274; Acesso Restrito</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUser">Usuário</label>
                    <input type="text" id="loginUser" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Senha</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn">Entrar</button>
            </form>
            <p id="loginError" style="color: #ff3333; margin-top: 1rem; display: none; text-align: center; font-size: 0.9rem;"></p>
        </div>
    </div>

    <div id="protectedContent" style="display: none;">
    <header>
        <a href="index.html" class="nav-logo">
            <img src="assets/logo.svg" alt="DM Photo" class="logo-img">
        </a>
        <div class="nav-links">
            <a href="index.html" target="_blank">Ver Catálogo</a>
            <a href="admin.html">Cadastrar</a>
            <a href="dados.html" class="active">Gerenciar</a>
        </div>
    </header>

    <main>
        <div class="filters">
            <div class="filter-group" id="category-filters">
                <button class="filter-btn" data-category="camera">Câmeras</button>
                <button class="filter-btn" data-category="lente">Lentes</button>
                <button class="filter-btn" data-category="cartao">Cartões</button>
                <button class="filter-btn" data-category="flash">Flash</button>
                <button class="filter-btn" data-category="microfone">Microfones</button>
                <button class="filter-btn" data-category="outro">Outros</button>
            </div>
            
            <div class="filter-group" id="brand-filters" style="margin-top: 10px; display: none;">
                <!-- Brand filters will be injected here -->
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                <div class="dollar-rate" id="dollar-display" style="margin-top: 0;">
                    Cotação Dólar: Carregando...
                </div>
                <button class="btn btn-secondary" id="refresh-data-btn" style="width: auto; padding: 0.5rem 1.2rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fa-solid fa-arrows-rotate"></i> Atualizar Dados
                </button>
            </div>
        </div>


        <div class="products-grid" id="products-grid">
            <!-- Products will be injected here via JS -->
        </div>
    </main>

    <div id="toast"></div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/calc.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
